[book]
title = "ekacache"
description = "A compile cache for Nix builds: the ec compiler launcher and the ecd daemon"
authors = ["The ekacache contributors"]
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[output.html]
git-repository-url = "https://github.com/ekala-project/jig"
edit-url-template = "https://github.com/ekala-project/jig/edit/main/book/{path}"
site-url = "/jig/"
no-section-label = false

[output.html.fold]
enable = true
level = 1
