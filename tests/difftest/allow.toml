# The allow-list for intended differences (implementation/12-testing.md §Allow-list).
#
# The adopted changes (behaviors/README.md §Adopted changes) are the only places where the Rust
# port is meant to differ from legacy. Each one has a rule here:
#
#   name     the rule, as in 12's table
#   adopted  the quirk ids of the adopted row
#   row      text quoted from that row of behaviors/README.md, so the rule points at it
#   differs  what may differ between Rust and legacy
#   tests    `file::function` of the tests that pin the difference (the differential test, or
#            the Rust-side test where legacy cannot be run against it)
#   note     optional
#
# The differential tests apply these rules in code, each at the line that names its quirk id
# (`grep -rn 'ADOPTED Q-'`). scripts/check-allow-list.sh checks that every adopted row has a
# rule, that every rule's row exists, and that every named test exists. A new entry must point
# at a row of the adopted-changes table: that is the guard against silent drift.

[[rule]]
name = "hello"
adopted = ["HELLO"]
row = "`HELLO <maxver>` / `OK <ver>` version negotiation"
differs = "the HELLO exchange in transcripts (normalised away)"
tests = [
  "crates/jigd/tests/difftest_wire.rs::hello_is_the_only_difference",
  "crates/jigd/tests/serve.rs::hello",
  "crates/jig-core/tests/spec_vectors.rs::value_encoding_vectors",
]

[[rule]]
name = "le-header"
adopted = ["Q-CLIENT-1"]
row = "Value header is defined as little-endian u32"
differs = "nothing on x86-64 and aarch64; the rule documents that the header is LE by definition"
tests = ["crates/jig-core/src/frame.rs::round_trip", "crates/jig-core/tests/spec_vectors.rs::value_encoding_vectors"]

[[rule]]
name = "hint-order"
adopted = ["Q-STORE-1"]
row = "Hint entries sorted by record offset"
differs = "hint file entry order (compared as sorted sets)"
tests = [
  "crates/jigd/tests/store.rs::seal_writes_hint_sorted_by_offset",
  "crates/jigd/tests/store.rs::loads_unsorted_hint",
]

[[rule]]
name = "put-reply-done-order"
adopted = ["Q-CLIENT-2", "Q-CC-2"]
row = "PUT replies checked; DONE sent after the PUTs"
differs = "position of DONE relative to the PUTs in the transcript; exit 1 for a refused `cache put`"
tests = [
  "crates/jig/tests/cc_mode.rs::refused_put",
  "crates/jig/tests/rustc_mode.rs::miss_store_hit",
  "crates/jig/tests/cache_cmd.rs::blobs",
]

[[rule]]
name = "path-mode-unmask"
adopted = ["Q-KEY-1", "Q-CC-7", "Q-DIR-1"]
row = "Path mode hands back unmasked text"
differs = "replayed depfile bytes and get-dir text files in path mode; `b/` hashes of path-mode text blobs"
tests = [
  "crates/jig/tests/cache_cmd.rs::difftest_trees_against_legacy",
  "crates/jig/tests/cache_cmd.rs::tree_round_trip",
]

[[rule]]
name = "transient-fail"
adopted = ["Q-CC-5"]
row = "Resource-exhaustion compile failures are not cached"
differs = "`compiled-error` becomes `failed`, and no `r/` or `e/` PUTs"
tests = ["crates/jig/tests/cc_mode.rs::adopted_rules"]

[[rule]]
name = "rs-schema-8"
adopted = ["Q-RS-3"]
row = "rustc tracks `# env-dep` in the manifest, `rs-schema=8`"
differs = "rustc k1s (compare preimages minus field 1), `$env:` manifest lines"
tests = [
  "crates/jig/tests/rustc_difftest.rs::difftest_env_deps",
  "crates/jig/tests/rustc_mode.rs::env_dep_lines",
  "crates/jig/tests/rustc_mode.rs::env_deps_with_real_rustc",
]

[[rule]]
name = "crate-type-split"
adopted = ["Q-RS-5"]
row = "rustc splits `--crate-type` on `,` for the link check"
differs = "comma `--crate-type` invocations are uncached in Rust"
tests = [
  "crates/jig/tests/rustc_difftest.rs::difftest_failures_and_unstored",
  "crates/jig/tests/rustc_mode.rs::uncached_outcomes",
]

[[rule]]
name = "unreadable-input"
adopted = ["Q-KEY-3"]
row = "An unreadable input makes the invocation uncached"
differs = "no PUTs when an input is unreadable"
tests = [
  "crates/jig/tests/rustc_mode.rs::compiled_unstored",
  "crates/jig/tests/legacy_jig.rs::test_manifest",
]

[[rule]]
name = "slot-cancel"
adopted = ["Q-SLOT-1"]
row = "A queued SLOT waiter whose peer hangs up is dequeued"
differs = "the timing of `waiting=` in STATS after an abandoned waiter"
tests = [
  "crates/jigd/tests/serve.rs::abandoned_waiter_is_dequeued",
  "crates/jigd/tests/slots_itf.rs::slots_traces_replay",
  "crates/jigd/tests/slots_itf.rs::slots_socket_traces_replay",
]

[[rule]]
name = "empty-packs"
adopted = ["Q-STORE-2"]
row = "Empty packs deleted at open and close"
differs = "empty pack files are absent"
tests = ["crates/jigd/tests/store.rs::empty_packs_are_dropped"]

[[rule]]
name = "kick-at-start"
adopted = ["Q-STORE-5"]
row = "demoter kicked at startup"
differs = "demotion log lines at startup"
tests = ["crates/jigd/tests/store.rs::over_budget_at_start_is_trimmed"]

[[rule]]
name = "fsync"
adopted = ["Q-STORE-7"]
row = "fsync on seal and on demotion, not per PUT"
differs = "nothing observable in the bytes"
tests = []
note = "strace-only; no automated check (12 §Allow-list). The store model's FSYNC_ON_SEAL is covered by store_itf."

[[rule]]
name = "cc-uncacheable-A"
adopted = ["Q-CC-14", "Q-CC-15"]
row = "Uncacheable: side-output flags"
differs = "no PUTs, and the `uncacheable` outcome, for side-output and C++20 module flags"
tests = ["crates/jig/tests/cc_mode.rs::adopted_rules"]

[[rule]]
name = "cc-uncacheable-B"
adopted = ["Q-CC-13"]
row = "hidden-input flags"
differs = "no PUTs, and the `uncacheable` outcome, for flags that name hidden inputs"
tests = ["crates/jig/tests/cc_mode.rs::adopted_rules"]

[[rule]]
name = "cc-uncacheable-C"
adopted = ["Q-CC-12"]
row = "`.incbin` in assembler sources"
differs = "no PUTs, and the `uncacheable` outcome, for assembler sources with `.incbin`"
tests = ["crates/jig/tests/cc_mode.rs::adopted_rules"]

[[rule]]
name = "cc-uncacheable-D"
adopted = ["Q-CC-16"]
row = "other toolchains' temp-dir compiles"
differs = "no PUTs, and the `uncacheable` outcome, for sources in other toolchains' temp dirs"
tests = ["crates/jig/tests/cc_mode.rs::adopted_rules"]

[[rule]]
name = "jigd-size-strict"
adopted = ["Q-DAEMON-1", "Q-ENV-3"]
row = "Strict `JIGD_SIZE` / `JIGD_COLD_SIZE`"
differs = "exit 2 and a message for invalid sizes; the budget log line"
tests = [
  "crates/jigd/tests/daemon.rs::invalid_budget_exits_2",
  "crates/jigd/tests/daemon.rs::budget_syntax",
]

[[rule]]
name = "gocache-json"
adopted = ["Q-GO-1", "Q-GO-3", "Q-GO-4"]
row = "Real JSON parser and serializer, strict base64, for gocacheprog"
differs = "`Err` replies and exit 1 for malformed lines; escaped DiskPath"
tests = [
  "crates/jig/tests/gocache_difftest.rs::adopted_json_handling_differs",
  "crates/jig/tests/gocache_transcript.rs::adopted_disk_path_escaping",
]
