[[vector]]
id = "elf-e2e"
kind = "doc-only"
section = "Test vectors > Derived and confirmed: ELF end to end (GNU ld output, gcc 14)"
stdout_shape = "lib/libbar.so  RUNPATH $ORIGIN/../../<G>/lib/:\u2026\nbin/foo  RUNPATH $ORIGIN/../../<G>/lib/:\u2026  NEEDED $ORIGIN/../lib//libbar.so  INTERP ../../<G>/lib/ld-linux-x86-64.so.2 (PT_NULL, entry=__reloc_start)\n"
note = "PT_INTERP becomes PT_NULL and e_entry = st_value(__reloc_start). The binaries come from this machine's gcc and glibc (<G> is its glibc), so crates/ekacache/tests/fixup_vectors.rs elf_end_to_end builds them and checks these shapes with the real names."

