# L1 spec vectors of behaviors/jig-reloc-fixup.md §Test vectors (implementation/12-testing.md
# §L1: spec vectors). S = /nix/store throughout; the binary-run kinds skip when the store dir is
# not /nix/store.
#
# kinds:
#   binary-image  TestBinaryImage (crates/ekacache/src/fixup/image.rs test_binary_image): an image
#                 of `image_hex` zero-padded to `image_len` bytes, then each step
#                 "<op> <args...> -> <result>" in order; ops is_elf64_le, read_u16/u32/u64,
#                 write_u32/u64, write_padded <at> <width> <text>, cstring <at>; results true,
#                 false, none, a 0x number or a C string (empty after "-> ").
#   macho         TestMachOFixup on the doc's 2048-byte image (crates/ekacache/tests/fixup_macho.rs
#                 test_mach_o_fixup builds the image): stdout, stderr, status, file size, the
#                 cmdsizes, sizeofcmds, NUL-terminated strings the file `contains` and `lacks`.
#   macho-unresolvable  The image with one LC_LOAD_DYLIB `load`, run with --sdk: stderr and
#                 status; the file is unchanged and stdout empty.
#   macho-tight   The tight-header image: stderr and status; unchanged, stdout empty.
#   macho-resign  The re-signing image with code signature hashType `hash_type`: stdout,
#                 stderr, status, cmdsizes, sizeofcmds, ncmds; `slots_hash_pages` that each code
#                 slot is the SHA-256 of its page; `unchanged` that the file is byte-identical.
#   cli           `jig reloc-fixup args` (crates/ekacache/tests/fixup_vectors.rs cli): stderr and
#                 status, stdout empty. <dir> is an existing empty directory; `usage` stands
#                 for the usage line (the doc does not spell it; its text is the top-level
#                 `usage`, checked against ekacache::fixup::USAGE).
#   deny          `--deny needle` over the top-level deny_files/deny_contents tree
#                 (fixup_vectors.rs deny): the stderr lines (compared sorted) and status.
#   relative-to   RelativeTo(dir, target, anchor) == result (crates/ekacache/src/fixup/mod.rs).
#   final         Final(path) == result with prefix/dest (mod.rs).
#   on-disk       OnDisk(path) == result with prefix/dest (mod.rs).
#   doc-only      not checked from here; `note` says why and where it is checked.

doc = "behaviors/jig-reloc-fixup.md"
usage = "usage: reloc-fixup <prefix> [--dest <store path>] [--sdk <dir>] [--deny <store path>]..."

# The deny tree: the doc's a.txt and sub/b.bin, two files the check skips, and `long`, a plain
# file standing for the doc's 100-byte RUNPATH hit (an `a` then 149 `b`s).
deny_files = ["a.txt", "sub/b.bin", "etc/jig.json", "y.debug", "long"]
deny_contents = ["abc\ndef", "\u0001xyz", "abc", "abc", "abbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]

