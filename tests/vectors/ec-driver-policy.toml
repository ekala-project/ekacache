# L1 spec vectors of behaviors/ec-driver-policy.md §Test vectors (implementation/12-testing.md
# §L1: spec vectors). Read by crates/ekacache/tests/driver_vectors.rs.
#
# The doc's notation is kept: the single arguments START, END and META, the five CRT_TAIL
# arguments, and `_×N` inside a string for N underscores. /nix/store stands for the store dir.
#
# kinds:
#   conf         ParseDriverConf(conf, self): the given fields of the result.
#   driver       BuildDriverArgs(conf, lang, args, PKGS_PREFIX_MAP = prefix_map). `conf` names a
#                top-level `conf_<name>` or is the JSON itself; `package_*` set conf.package.
#                Expectations, all optional:
#                  out        the whole output
#                  contains   substrings of the output joined with spaces; `lacks` the reverse
#                  has_arg    whole arguments in the output
#                  index/index_values  out[index[i]] == index_values[i]
#                  user       the arguments after END up to -Wl,--undefined-version (or the end)
#                  rpath      the argument right after -Wl,--undefined-version
#                  ends_with  the last arguments
#                `tempdir_files`: files created in a fresh directory that <W> names.
#   driver-store-lib  TV-33: needs a writable directory <Z> under the store dir holding
#                `libz.so`; <Z> is spelled as created in the arguments, canonical in `rpath`.
#   shared-lib-name   IsSharedLibName(name) == shared.
#   search-dirs  WithPackageLibDirs(text, ldflags) == result.
#   conf-parse   ParseDriverConf(text or text_hex, ""): `status` 2 with `stderr` (Fatal::Exit of
#                stderr + "\n"), `abort` (SIGABRT), or parse ok with the given fields.
#   end-to-end   TV-37 on the built binary at R/bin/ec (crates/ekacache/tests/cc_mode.rs): R/etc/ekacache.json
#                = `conf` when given, run `tool args` with `env` (NAME=VALUE); <R> is the root. The
#                given of status, stdout, stdout_ends_with, stderr and log (the $EKACACHE_LOG rows
#                without their times) are checked.
#   pkgs-cc      PackageFlags(pkgs_cc, R) with <R> = R: `none` (no package flags, no error) or
#                `abort` (SIGABRT).

doc = "behaviors/ec-driver-policy.md"

conf_elf = '{"cc": "/seed/bin/clang", "flags": ["--target=x", "-O2"], "cxxflags": ["-stdlib=libc++"], "libc": "/sr/libc", "crt": "/cc/lib/crt_interp.o", "runtimes": "/sr/rt/lib"}'
conf_coff = '{"cc": "/seed/bin/clang", "binfmt": "coff", "flags": ["--target=x86_64-pc-windows-msvc"]}'
conf_macho = '{"cc": "/seed/bin/clang", "binfmt": "macho", "flags": ["--target=arm64-apple-macos14.0"], "libc": "/sr"}'

