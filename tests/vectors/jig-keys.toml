# ---- Manifest test vectors ----------------------------------------------------------------

[[vector]]
kind = "manifest-scenario"
section = "Manifest test vectors"
note = "The k2 hashes these literal paths, so the test must use exactly /tmp/jigprobe."
root = "/tmp/jigprobe/t"
files = ["a.h", "b.h", "src.c"]
contents = ["int a;\n", "int b;\n", ""]
k1_of = "k1"
k1_text = "ffb4332755be52674d663ce9586917c9"
inputs = [
  "/tmp/jigprobe/t/src.c",
  "/tmp/jigprobe/t/a.h",
  "/tmp/jigprobe/t/./b.h",
  "/tmp/jigprobe/t/missing.h",
  "/tmp/jigprobe/t/a.h",
]
primary_source = "/tmp/jigprobe/t/src.c"
absent = [
  "/tmp/jigprobe/t/early/a.h",
  "",
  "/tmp/jigprobe/t/early/a.h",
  "/tmp/jigprobe/t/a.h",
  "/nix/store/1123456789abcdfghijklmnpqrsvwxyz-glibc-2.40/include/x.h",
  "rel/q.h",
]
# ADOPTED Q-KEY-3: the unreadable input makes the manifest unstorable; the expected text is
# that of the inputs without it.
unstorable = "/tmp/jigprobe/t/missing.h"
text = "/tmp/jigprobe/t/a.h\tC:0d937065826369d51c16019b838d8932\n/tmp/jigprobe/t/b.h\tC:709be0706c9c4004a3ae4d9c20050e55\n/tmp/jigprobe/t/a.h\tC:0d937065826369d51c16019b838d8932\n!/tmp/jigprobe/t/early/a.h\n!rel/q.h\n"
k2 = "ca06f7cce6259fa171f39edb0e29b4a8"
junk = "junk line\n\n"
appear = "early/a.h"
appeared = "appeared:/tmp/jigprobe/t/early/a.h"
edit = "b.h"
edit_contents = "int b2;\n"
changed = "inputs-changed:/tmp/jigprobe/t/b.h"

