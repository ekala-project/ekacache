# L1 spec vectors of behaviors/jig-keys.md (implementation/12-testing.md §L1: spec vectors).
# Read by crates/jig-core/tests/spec_vectors.rs. Extracted by hand; keep in step with the doc.
#
# kinds:
#   digest            `Hasher` ops -> digest. `fields` = one Field call each, `hash_of` = HashOf
#                     (no framing), `repeat`/`count` = one Field of `count` copies of `repeat`.
#                     `framed` = the bytes fed to BLAKE3, checked with HashOf as well.
#   key               `Key(arg)` in `mode` (path unless given); `default_store_only` vectors
#                     spell /nix/store and hold only for the default JIG_STORE_DIR.
#   composite         a cc k1 from `fields`; `k1` the cc text, `rs_text` the rustc text.
#   manifest-k2       a k2 from the k1 text and the manifest lines (pure Hasher).
#   manifest-scenario BuildManifest/ValidateManifest over the /tmp/jigprobe/t setup.
#   manifest-validate ValidateManifest of `text` in `mode` alone; /nix/store in `text` stands
#                     for the store dir.
#   doc-only          not checked; `note` says why.

doc = "behaviors/jig-keys.md"

