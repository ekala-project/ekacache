[workspace]
resolver = "3"
members = ["crates/ekacache-core", "crates/ekacached", "crates/ekacache", "crates/ekacache-testkit"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ekala-project/jig"

# Every dependency is listed in implementation/01-workspace.md §Dependencies with the reason it
# is here. Adding one needs a row in that table.
[workspace.dependencies]
ekacache-core = { path = "crates/ekacache-core", default-features = false }
ekacached = { path = "crates/ekacached" }
ekacache = { path = "crates/ekacache" }
ekacache-testkit = { path = "crates/ekacache-testkit" }
blake3 = { version = "1", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false, features = ["pkg-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "net", "process", "pipe", "stdio", "termios", "time", "thread", "param"] }
object = { version = "0.36", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "signal", "macros", "time", "fs"] }
memchr = { version = "2", default-features = false, features = ["std"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
# ekacache-core denies unsafe outright (#![deny(unsafe_code)] in lib.rs); ec and ecd warn, and
# every use carries a // SAFETY: comment.
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# the allow-list (implementation/01-workspace.md §Toolchain and lints)
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
