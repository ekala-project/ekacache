[package]
name = "ekacache-core"
description = "What ec and ecd must agree on byte for byte: hasher, keys, store paths, value framing, wire codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["frame"]
# value framing (zstd). jigd never decompresses values and can build without it.
frame = ["dep:zstd"]

[dependencies]
blake3.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
# the L1 vector reader, used only by tests/spec_vectors.rs (a dev-dependency cycle is fine for
# integration tests: they link the one ekacache-core library that ekacache-testkit links)
ekacache-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
